<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Passenger Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <style>
        body { margin: 0; background-color: #0f172a; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* The contained window for the camera */
        .scanner-window {
            position: relative;
            width: 90vw;
            max-width: 450px;
            aspect-ratio: 3/4; /* Makes it a vertical rectangle */
            background-color: #000;
            border-radius: 24px;
            overflow: hidden;
            border: 4px solid #334155;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            margin-top: 2rem;
        }

        /* Both video and canvas scale together perfectly */
        #video, #canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        #canvas { z-index: 10; }
    </style>
</head>
<body class="font-sans antialiased">

    <!-- Top UI -->
    <div class="w-full max-w-md p-4 flex justify-between items-center z-20 mt-4">
        <button onclick="window.location.href='/'" class="bg-slate-800 text-white p-3 rounded-full hover:bg-slate-700 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        </button>
        
        <div class="bg-slate-800 rounded-2xl px-6 py-2 text-center border border-slate-700 shadow-lg">
            <p class="text-xs text-slate-400 font-bold uppercase tracking-widest mb-1">Passengers</p>
            <p id="passengerCount" class="text-3xl font-extrabold text-white">0</p>
        </div>
    </div>

    <!-- The Scanner Box -->
    <div class="scanner-window">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <!-- Status Indicator -->
    <div class="mt-4 z-20 flex items-center gap-3">
        <div id="statusBadge" class="bg-yellow-500/80 text-white px-5 py-2 rounded-full text-sm font-bold shadow-lg">
            Loading AI Model...
        </div>
        <button id="switchCamBtn" class="hidden bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-full text-sm font-bold shadow-lg border border-slate-700 transition active:scale-95">
            <svg class="w-4 h-4 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7v5h-5M4 17v-5h5m-3.5-3A7 7 0 0 1 18 6l2 2M4 16l2 2a7 7 0 0 0 12.5-3"/></svg>Switch Cam
        </button>
    </div>

    <!-- Scanner Line Adjustment Controls -->
    <div class="w-full max-w-sm bg-slate-800/90 text-white rounded-2xl border border-slate-700 shadow-xl p-4 mt-3 mb-6 space-y-2 z-20">
        <div>
            <span class="text-xs font-bold text-slate-300 uppercase tracking-wider">Detection Line</span>
        </div>
        <div class="flex items-center justify-between gap-2">
            <!-- Quick Orientation Presets -->
            <div class="flex items-center bg-slate-900 p-1 rounded-xl text-xs font-semibold gap-1">
                <button type="button" id="btnLineVert" onclick="setScannerLineOrientation('vertical')" class="px-2.5 py-1 rounded-lg transition text-slate-400 hover:text-white">
                    Vertical (|)
                </button>
                <button type="button" id="btnLineHoriz" onclick="setScannerLineOrientation('horizontal')" class="px-2.5 py-1 rounded-lg transition text-slate-400 hover:text-white">
                    Horizontal (—)
                </button>
            </div>
                <button type="button" onclick="resetScannerLine()" class="shrink-0 px-2.5 py-1 rounded-lg border border-slate-600 bg-slate-900 hover:bg-slate-700 text-slate-300 font-semibold text-[11px] transition active:scale-95">
                    Reset to default
                </button>
        </div>

        <!-- Angle Adjustment Slider Bar -->
        <div class="space-y-1">
            <div class="flex justify-between items-center text-xs text-slate-400">
                <span>Line Angle</span>
                <span id="lineAngleLabel" class="font-bold text-emerald-400">90° (Vertical)</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-[10px] text-slate-400 font-medium">0°</span>
                <input type="range" id="lineAngleSlider" min="0" max="180" value="90" step="1" 
                       oninput="onScannerAngleChange(this.value)"
                       class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500">
                <span class="text-[10px] text-slate-400 font-medium">180°</span>
            </div>
        </div>

        <!-- Position Adjustment Slider Bar -->
        <div class="space-y-1">
            <div class="flex justify-between items-center text-xs text-slate-400">
                <span>Line Position</span>
                <span id="lineOffsetLabel" class="font-bold text-emerald-400">Center</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-[10px] text-slate-400 font-medium">-50%</span>
                <input type="range" id="lineOffsetSlider" min="-50" max="50" value="0" step="1" 
                       oninput="onScannerOffsetChange(this.value)"
                       class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-500">
                <span class="text-[10px] text-slate-400 font-medium">+50%</span>
            </div>
        </div>
        
        <!-- Invert Direction Button -->
        <div class="pt-2 flex items-center justify-between border-t border-slate-700 text-xs">
            <span class="text-slate-400">Boarding Direction:</span>
            <button type="button" id="btnInvertDir" onclick="toggleScannerDirection()" class="px-2.5 py-1 bg-slate-900 hover:bg-slate-700 text-slate-200 font-semibold rounded-lg border border-slate-700 transition text-[11px] flex items-center gap-1 active:scale-95">
                <span id="directionLabel">Normal</span> ⇄
            </button>
        </div>
    </div>

    <script type="module">
        let activeStream = null;
        let currentCameraIndex = 0;
        let availableCameras = [];
        let globalModel = null;

        let scannerConfig = {
            angle: parseInt(localStorage.getItem('qc_scanner_line_angle') || '90', 10),
            offset: parseInt(localStorage.getItem('qc_scanner_line_offset') || '0', 10),
            inverted: localStorage.getItem('qc_scanner_inverted') === 'true'
        };

        function getLineGeometry(width, height) {
            const rad = (scannerConfig.angle * Math.PI) / 180;
            const cx = width / 2;
            const cy = height / 2;
            
            const inDirX = Math.sin(rad);
            const inDirY = Math.cos(rad);
            const lineDirX = Math.cos(rad);
            const lineDirY = -Math.sin(rad);
            
            const offsetPx = (scannerConfig.offset / 100) * Math.min(width, height);
            const x0 = cx + offsetPx * inDirX;
            const y0 = cy + offsetPx * inDirY;
            
            const L = Math.hypot(width, height) + 120;
            const x1 = x0 - L * lineDirX;
            const y1 = y0 - L * lineDirY;
            const x2 = x0 + L * lineDirX;
            const y2 = y0 + L * lineDirY;
            
            return { x0, y0, inDirX, inDirY, lineDirX, lineDirY, x1, y1, x2, y2 };
        }

        function getLineSignedDistance(px, py, geom) {
            let d = (px - geom.x0) * geom.inDirX + (py - geom.y0) * geom.inDirY;
            return scannerConfig.inverted ? -d : d;
        }

        function updateScannerControlsUI() {
            const angleSlider = document.getElementById('lineAngleSlider');
            const offsetSlider = document.getElementById('lineOffsetSlider');
            const angleLabel = document.getElementById('lineAngleLabel');
            const offsetLabel = document.getElementById('lineOffsetLabel');
            const dirLabel = document.getElementById('directionLabel');
            const btnVert = document.getElementById('btnLineVert');
            const btnHoriz = document.getElementById('btnLineHoriz');

            if (angleSlider) angleSlider.value = scannerConfig.angle;
            if (offsetSlider) offsetSlider.value = scannerConfig.offset;

            if (angleLabel) {
                let text = `${scannerConfig.angle}°`;
                if (scannerConfig.angle === 90) text += ' (Vertical)';
                else if (scannerConfig.angle === 0 || scannerConfig.angle === 180) text += ' (Horizontal)';
                angleLabel.textContent = text;
            }

            if (offsetLabel) {
                offsetLabel.textContent = scannerConfig.offset === 0 
                    ? 'Center' 
                    : `${scannerConfig.offset > 0 ? '+' : ''}${scannerConfig.offset}%`;
            }

            if (dirLabel) {
                dirLabel.textContent = scannerConfig.inverted ? 'Inverted' : 'Normal';
            }

            if (btnVert && btnHoriz) {
                if (scannerConfig.angle === 90) {
                    btnVert.className = 'px-2.5 py-1 rounded-lg transition bg-emerald-600 text-white shadow-sm';
                    btnHoriz.className = 'px-2.5 py-1 rounded-lg transition text-slate-400 hover:text-white';
                } else if (scannerConfig.angle === 0 || scannerConfig.angle === 180) {
                    btnHoriz.className = 'px-2.5 py-1 rounded-lg transition bg-emerald-600 text-white shadow-sm';
                    btnVert.className = 'px-2.5 py-1 rounded-lg transition text-slate-400 hover:text-white';
                } else {
                    btnVert.className = 'px-2.5 py-1 rounded-lg transition text-slate-400 hover:text-white';
                    btnHoriz.className = 'px-2.5 py-1 rounded-lg transition text-slate-400 hover:text-white';
                }
            }
        }

        window.setScannerLineOrientation = function(orientation) {
            if (orientation === 'vertical') {
                window.onScannerAngleChange(90);
            } else if (orientation === 'horizontal') {
                window.onScannerAngleChange(0);
            }
        };

        window.onScannerAngleChange = function(val) {
            scannerConfig.angle = parseInt(val, 10);
            localStorage.setItem('qc_scanner_line_angle', scannerConfig.angle);
            updateScannerControlsUI();
        };

        window.onScannerOffsetChange = function(val) {
            scannerConfig.offset = parseInt(val, 10);
            localStorage.setItem('qc_scanner_line_offset', scannerConfig.offset);
            updateScannerControlsUI();
        };

        window.toggleScannerDirection = function() {
            scannerConfig.inverted = !scannerConfig.inverted;
            localStorage.setItem('qc_scanner_inverted', scannerConfig.inverted);
            updateScannerControlsUI();
        };

        window.resetScannerLine = function() {
            scannerConfig.angle = 90;
            scannerConfig.offset = 0;
            scannerConfig.inverted = false;
            localStorage.setItem('qc_scanner_line_angle', scannerConfig.angle);
            localStorage.setItem('qc_scanner_line_offset', scannerConfig.offset);
            localStorage.setItem('qc_scanner_inverted', scannerConfig.inverted);
            updateScannerControlsUI();
        };

        let scannerSessionId = 0;

        initScanner();

        async function initScanner(preferredDeviceId = null) {
            const currentSession = ++scannerSessionId;
            updateScannerControlsUI();
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const countDisplay = document.getElementById('passengerCount');
            const statusBadge = document.getElementById('statusBadge');
            const switchBtn = document.getElementById('switchCamBtn');
            
            let passengerCount = 0;
            let trackedEntities = {}; 
            let entityIdCounter = 0;

            try {
                if (window.tf) {
                    try {
                        await tf.setBackend('webgl');
                        tf.env().set('WEBGL_PACK', true);
                        tf.env().set('WEBGL_DELETE_TEXTURE_THRESHOLD', 0); // Immediately delete intermediate textures to prevent GC stutter
                        tf.env().set('WEBGL_FORCE_F16_TEXTURES', true);
                        tf.env().set('WEBGL_VERSION', 2);
                    } catch (e) {
                        console.warn("TF WebGL note:", e);
                    }
                }

                // Enumerate cameras
                try {
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    availableCameras = devices.filter(d => d.kind === 'videoinput');
                    if (switchBtn) {
                        if (availableCameras.length > 1) {
                            switchBtn.classList.remove('hidden');
                            switchBtn.onclick = () => switchScannerCamera();
                        } else {
                            switchBtn.classList.add('hidden');
                        }
                    }
                } catch (e) {}

                const constraintOptions = [];
                if (preferredDeviceId) {
                    constraintOptions.push({
                        video: {
                            deviceId: { exact: preferredDeviceId },
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        }
                    });
                    constraintOptions.push({ video: { deviceId: { exact: preferredDeviceId } } });
                } else {
                    constraintOptions.push({
                        video: { 
                            facingMode: { ideal: "environment" },
                            width: { ideal: 480, max: 640 },
                            height: { ideal: 480, max: 640 },
                            frameRate: { ideal: 30, max: 30 }
                        } 
                    });
                    constraintOptions.push({ video: { facingMode: { ideal: "environment" } } });
                    if (availableCameras.length > 0 && availableCameras[currentCameraIndex]) {
                        constraintOptions.push({
                            video: {
                                deviceId: { ideal: availableCameras[currentCameraIndex].deviceId },
                                width: { ideal: 640 },
                                height: { ideal: 480 }
                            }
                        });
                    }
                    constraintOptions.push({ video: { width: { ideal: 640 }, height: { ideal: 480 } } });
                    constraintOptions.push({ video: true });
                }

                let stream = null;
                for (const c of constraintOptions) {
                    try {
                        stream = await navigator.mediaDevices.getUserMedia(c);
                        if (stream) break;
                    } catch (e) {}
                }

                if (!stream) throw new Error("Camera unavailable");

                if (activeStream) {
                    activeStream.getTracks().forEach(t => t.stop());
                }
                activeStream = stream;

                video.muted = true;
                video.defaultMuted = true;
                video.playsInline = true;
                video.setAttribute('playsinline', '');
                video.setAttribute('muted', '');
                video.srcObject = activeStream;

                await new Promise((resolve) => {
                    if (video.readyState >= 2 && video.videoWidth > 0) {
                        resolve();
                    } else {
                        let done = false;
                        const onReady = () => {
                            if (!done) {
                                done = true;
                                video.removeEventListener('loadeddata', onReady);
                                video.removeEventListener('loadedmetadata', onReady);
                                resolve();
                            }
                        };
                        video.addEventListener('loadeddata', onReady);
                        video.addEventListener('loadedmetadata', onReady);
                        setTimeout(onReady, 800);
                    }
                });

                try {
                    await video.play();
                } catch (e) {}

                // Performance enhancement: clamp canvas resolution to max 640px to eliminate lag
                const maxDim = 640;
                const vWidth = video.videoWidth || 640;
                const vHeight = video.videoHeight || 480;
                const scale = Math.min(1, maxDim / Math.max(vWidth, vHeight));
                canvas.width = Math.round(vWidth * scale);
                canvas.height = Math.round(vHeight * scale);

                if (!globalModel) {
                    globalModel = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
                }
                statusBadge.textContent = "Scanner Active";
                statusBadge.className = "bg-emerald-500 text-white px-5 py-2 rounded-full text-sm font-bold shadow-lg";
                
                runScanner(video, globalModel, currentSession);

                // Auto-detect completely black frame & auto-switch if another camera is connected
                setTimeout(() => {
                    if (video.readyState >= 2 && availableCameras.length > 1) {
                        try {
                            const testCanvas = document.createElement('canvas');
                            testCanvas.width = 16;
                            testCanvas.height = 16;
                            const testCtx = testCanvas.getContext('2d', { willReadFrequently: true });
                            testCtx.drawImage(video, 0, 0, 16, 16);
                            const data = testCtx.getImageData(0, 0, 16, 16).data;
                            let sum = 0;
                            for (let i = 0; i < data.length; i += 4) {
                                sum += data[i] + data[i+1] + data[i+2];
                            }
                            if (sum === 0) {
                                console.warn("Camera frame is 100% black; auto-switching to next camera...");
                                switchScannerCamera();
                            }
                        } catch (e) {}
                    }
                }, 1200);
            } catch (err) {
                statusBadge.textContent = "Camera Error";
                statusBadge.className = "bg-red-500 text-white px-5 py-2 rounded-full text-sm font-bold shadow-lg";
                return;
            }

            function runScanner(video, model, sessionId) {
                const AI_SIZE = 256;
                const offscreen = document.createElement('canvas');
                offscreen.width = AI_SIZE;
                offscreen.height = AI_SIZE;
                const offCtx = offscreen.getContext('2d', { willReadFrequently: true });
                offCtx.imageSmoothingEnabled = false;

                let isDetecting = false;

                // 60 FPS Render loop for line and tracker boxes
                function render() {
                    if (sessionId !== scannerSessionId) return;

                    // Directly paint video to canvas (fixes black video in Chrome on PC)
                    if (video.readyState >= 2) {
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    } else {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                    }
                    
                    const geom = getLineGeometry(canvas.width, canvas.height);

                    // Draw detection line at adjusted angle and offset
                    ctx.beginPath();
                    ctx.moveTo(geom.x1, geom.y1);
                    ctx.lineTo(geom.x2, geom.y2);
                    ctx.strokeStyle = "rgba(239, 68, 68, 0.9)";
                    ctx.lineWidth = 4;
                    ctx.stroke();

                    // Direction indicator badges (IN and OUT pills)
                    const tagDist = 28;
                    const inDirX = scannerConfig.inverted ? -geom.inDirX : geom.inDirX;
                    const inDirY = scannerConfig.inverted ? -geom.inDirY : geom.inDirY;
                    const inTagX = geom.x0 + inDirX * tagDist;
                    const inTagY = geom.y0 + inDirY * tagDist;
                    const outTagX = geom.x0 - inDirX * tagDist;
                    const outTagY = geom.y0 - inDirY * tagDist;

                    ctx.font = "bold 11px system-ui, sans-serif";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";

                    // Green IN indicator pill
                    ctx.fillStyle = "rgba(16, 185, 129, 0.9)";
                    ctx.beginPath();
                    ctx.arc(inTagX, inTagY, 12, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.fillStyle = "#ffffff";
                    ctx.fillText("IN", inTagX, inTagY);

                    // Red OUT indicator pill
                    ctx.fillStyle = "rgba(239, 68, 68, 0.9)";
                    ctx.beginPath();
                    ctx.arc(outTagX, outTagY, 12, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.fillStyle = "#ffffff";
                    ctx.fillText("OUT", outTagX, outTagY);

                    const now = Date.now();
                    for (const entity of Object.values(trackedEntities)) {
                        if (entity.box && now - entity.lastSeen < 600) {
                            ctx.strokeStyle = entity.counted ? "#10B981" : "#38BDF8";
                            ctx.lineWidth = 3;
                            ctx.strokeRect(entity.box.x, entity.box.y, entity.box.w, entity.box.h);

                            ctx.beginPath();
                            ctx.arc(entity.x, entity.y, 6, 0, 2 * Math.PI);
                            ctx.fillStyle = entity.counted ? "#10B981" : "#38BDF8";
                            ctx.fill();
                        }
                    }

                    requestAnimationFrame(render);
                }
                requestAnimationFrame(render);

                // Cooperative AI detection loop: yields smoothly to keep camera video at 60 FPS
                async function detectLoop() {
                    while (sessionId === scannerSessionId) {
                        if (!isDetecting && video.readyState >= 2) {
                            isDetecting = true;
                            try {
                                offCtx.drawImage(video, 0, 0, AI_SIZE, AI_SIZE);
                                const predictions = await model.detect(offscreen, 3, 0.38);

                                const scaleX = canvas.width / AI_SIZE;
                                const scaleY = canvas.height / AI_SIZE;
                                const geom = getLineGeometry(canvas.width, canvas.height);
                                const now = Date.now();

                                const people = predictions.filter(p => {
                                    return p.class === 'person' && p.bbox[3] > (p.bbox[2] * 0.7);
                                });

                                let currentFrameEntities = {};

                                for (const person of people) {
                                    const [bx, by, bw, bh] = person.bbox;
                                    const x = bx * scaleX;
                                    const y = by * scaleY;
                                    const w = bw * scaleX;
                                    const h = bh * scaleY;
                                    const centerX = x + (w / 2);
                                    const centerY = y + (h / 2);

                                    let matchedId = null;
                                    let minDistance = canvas.width * 0.35;

                                    for (const [id, data] of Object.entries(trackedEntities)) {
                                        const dist = Math.hypot(centerX - data.x, centerY - data.y);
                                        if (dist < minDistance) {
                                            minDistance = dist;
                                            matchedId = id;
                                        }
                                    }

                                    if (!matchedId) {
                                        matchedId = String(entityIdCounter++);
                                        trackedEntities[matchedId] = { x: centerX, y: centerY, counted: false, lastSeen: now, box: { x, y, w, h } };
                                    }
                                    
                                    const prevDist = getLineSignedDistance(trackedEntities[matchedId].x, trackedEntities[matchedId].y, geom);
                                    const currDist = getLineSignedDistance(centerX, centerY, geom);
                                    const wasCounted = trackedEntities[matchedId].counted;

                                    currentFrameEntities[matchedId] = { x: centerX, y: centerY, counted: wasCounted, lastSeen: now, box: { x, y, w, h } };

                                    // Line crossing math with arbitrary angle!
                                    if (!wasCounted) {
                                        if (prevDist < 0 && currDist >= 0) {
                                            passengerCount++;
                                            currentFrameEntities[matchedId].counted = true;
                                            flashScreen('rgba(16, 185, 129, 0.3)');
                                        } else if (prevDist > 0 && currDist <= 0) {
                                            if (passengerCount > 0) passengerCount--;
                                            currentFrameEntities[matchedId].counted = true;
                                            flashScreen('rgba(239, 68, 68, 0.3)');
                                        }
                                    }

                                    // Reset count eligibility when moving away from the line
                                    const resetThreshold = Math.min(canvas.width, canvas.height) * 0.18;
                                    if (Math.abs(currDist) > resetThreshold) {
                                        currentFrameEntities[matchedId].counted = false;
                                    }
                                }

                                for (const [id, entity] of Object.entries(trackedEntities)) {
                                    if (!currentFrameEntities[id] && now - entity.lastSeen < 500) {
                                        currentFrameEntities[id] = entity;
                                    }
                                }

                                trackedEntities = currentFrameEntities;
                                countDisplay.innerText = passengerCount;
                            } catch (err) {
                                console.error("Detection error:", err);
                            } finally {
                                isDetecting = false;
                            }
                        }

                        // Yield thread cooperatively so camera video & UI stay silky smooth at 60 FPS
                        await new Promise(r => requestAnimationFrame(r));
                        await new Promise(r => setTimeout(r, 60));
                    }
                }
                detectLoop();
            }

            function flashScreen(color) {
                const flash = document.createElement('div');
                flash.style.position = 'absolute';
                flash.style.inset = '0';
                flash.style.backgroundColor = color;
                flash.style.zIndex = '15';
                flash.style.pointerEvents = 'none';
                flash.style.transition = 'opacity 0.2s';
                document.querySelector('.scanner-window').appendChild(flash);
                
                setTimeout(() => {
                    flash.style.opacity = '0';
                    setTimeout(() => flash.remove(), 200);
                }, 50);
            }
        }

        async function switchScannerCamera() {
            if (availableCameras.length <= 1) return;
            currentCameraIndex = (currentCameraIndex + 1) % availableCameras.length;
            const nextCam = availableCameras[currentCameraIndex];
            if (nextCam) {
                initScanner(nextCam.deviceId);
            }
        }
        window.switchScannerCamera = switchScannerCamera;
    </script>
</body>
</html>
