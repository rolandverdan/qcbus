<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#115272">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="QC Bus Conductor">
    <title>QC Bus Tracker · Conductor</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" href="icons/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Quezon City official palette (matches QC E-Services)
                        'qc-blue': '#0D3B54',          // darker navy — gradient start
                        'qc-blue-accent': '#115272',   // QC E-Services accent — gradient end
                        'qc-red': '#CE1126',           // official QC/PH red
                        'qc-yellow': '#FCD116',        // official QC/PH yellow
                        // Conductor-specific (kept for trip/counter UI)
                        'qc-green': '#16a34a',
                    },
                    fontFamily: {
                        sans: ['system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
                    },
                    keyframes: {
                        'pulse-ring': {
                            '0%':   { transform: 'scale(0.8)', opacity: '1' },
                            '100%': { transform: 'scale(2.4)', opacity: '0' },
                        },
                    },
                    animation: {
                        'pulse-ring': 'pulse-ring 1.5s cubic-bezier(0.4,0,0.6,1) infinite',
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-sans antialiased">


<!-- Loading Overlay -->
    <div
  id="appLoader"
  class="fixed inset-0 z-[9999] flex items-center justify-center bg-white opacity-100 transition-opacity duration-500"
>
  <div class="flex flex-col items-center">

    <div class="mb-6 animate-pulse">
      <img
        src="/images/qclogo2.png"
        alt="QCommute"
        class="h-20 w-20 object-contain"
      />
    </div>

    <h1 class="text-xl font-bold tracking-tight text-qc-blue">
      QC Bus
    </h1>

    <p class="mt-2 text-sm text-gray-500">
      Loading
      <span class="inline-flex ml-1">
        <span class="animate-bounce [animation-delay:0ms]">.</span>
        <span class="animate-bounce [animation-delay:150ms]">.</span>
        <span class="animate-bounce [animation-delay:300ms]">.</span>
      </span>
    </p>

    </div>

  </div>
</div>



<div id="app" class="max-w-md mx-auto bg-gray-50 min-h-screen relative shadow-xl">

    <!-- ========== HEADER ========== -->
    <header class="bg-gradient-to-br from-qc-blue to-qc-blue-accent text-white sticky top-0 z-40 shadow-md">
        <div class="px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <img src="../images/qclogo2.png" alt="Quezon City" class="w-9 h-9 object-contain rounded-lg bg-white/10 p-0.5">
                <div class="leading-tight">
                    <h1 class="font-bold text-sm" id="pageTitle">Conductor Dashboard</h1>
                    <p class="text-[10px] text-white/75 tracking-wide" id="tripStatus">Quezon City · No active trip</p>
                </div>
            </div>

            <!-- SOS Button — heartbeat animation removed -->
            <button id="sosHeaderBtn" class="w-10 h-10 bg-qc-red hover:bg-red-700 rounded-full flex items-center justify-center shadow-lg transition active:scale-95">
                <span class="font-bold text-xs">SOS</span>
            </button>
        </div>

        <!-- Thin QC accent line -->
        <div class="h-0.5 bg-gradient-to-r from-qc-yellow via-qc-red to-qc-yellow"></div>
    </header>

    <!-- ========== PAGE CONTENT ========== -->
    <main id="content" class="p-4 pb-24">
        <!-- Dynamically loaded -->
    </main>

    <!-- ========== BOTTOM NAV ========== -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 z-50">
        <div class="grid grid-cols-4 h-16">
            <button data-page="trip" class="nav-btn flex flex-col items-center justify-center gap-1 text-xs text-qc-blue-accent transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
                </svg>
                <span>Trip</span>
            </button>
            <button data-page="counter" class="nav-btn flex flex-col items-center justify-center gap-1 text-xs text-gray-400 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                </svg>
                <span>Counter</span>
            </button>
            <button data-page="alerts" class="nav-btn flex flex-col items-center justify-center gap-1 text-xs text-gray-400 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
                <span>Alerts</span>
            </button>
            <button data-page="account" class="nav-btn flex flex-col items-center justify-center gap-1 text-xs text-gray-400 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
                <span>Account</span>
            </button>
        </div>
    </nav>
</div>

<div id="liveMapPanel" class="live-map-panel hidden" aria-hidden="true">
    <div class="live-map-panel-header">
        <div>
            <h2>Live route map</h2>
            <p id="liveMapStopLabel">Waiting for location</p>
        </div>
        <button id="liveMapClose" type="button" aria-label="Close live map" title="Close map">×</button>
    </div>
    <div id="liveMapCanvas" class="live-map-canvas"></div>
</div>

<button id="liveMapFab" class="live-map-fab hidden" type="button" aria-label="Open live route map" title="Open live route map">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z" />
        <path d="M9 3v15m6-12v15" />
        <circle cx="12" cy="10" r="2" fill="currentColor" />
    </svg>
</button>

<!-- ========== SOS OVERLAY MODAL ========== -->
<div id="sosModal" class="fixed inset-0 z-[100] hidden">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeSOS()"></div>
    <div class="absolute inset-x-0 bottom-0 max-w-md mx-auto bg-white rounded-t-3xl shadow-2xl p-6 slide-up">
        <div class="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-4"></div>

        <div class="flex items-center gap-3 mb-4">
            <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center">
                <svg class="w-6 h-6 text-qc-red" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
            </div>
            <div>
                <h3 class="font-bold text-lg text-gray-800">Emergency SOS</h3>
                <p class="text-xs text-gray-500">Choose an emergency type</p>
            </div>
        </div>

        <div class="space-y-2 mb-4">
            <button onclick="triggerSOS('medical')" class="w-full p-3 flex items-center gap-3 bg-red-50 hover:bg-red-100 border border-red-100 rounded-xl transition text-left">
                <span class="text-xl">🚑</span>
                <div>
                    <p class="text-sm font-semibold text-gray-800">Medical Emergency</p>
                    <p class="text-xs text-gray-500">Passenger needs medical help</p>
                </div>
            </button>
            <button onclick="triggerSOS('crime')" class="w-full p-3 flex items-center gap-3 bg-orange-50 hover:bg-orange-100 border border-orange-100 rounded-xl transition text-left">
                <span class="text-xl">🚨</span>
                <div>
                    <p class="text-sm font-semibold text-gray-800">Crime / Theft</p>
                    <p class="text-xs text-gray-500">Report a security incident</p>
                </div>
            </button>
            <button onclick="triggerSOS('accident')" class="w-full p-3 flex items-center gap-3 bg-yellow-50 hover:bg-yellow-100 border border-yellow-100 rounded-xl transition text-left">
                <span class="text-xl">💥</span>
                <div>
                    <p class="text-sm font-semibold text-gray-800">Road Accident</p>
                    <p class="text-xs text-gray-500">Collision or vehicle issue</p>
                </div>
            </button>
            <button onclick="triggerSOS('other')" class="w-full p-3 flex items-center gap-3 bg-gray-50 hover:bg-gray-100 border border-gray-100 rounded-xl transition text-left">
                <span class="text-xl">⚠️</span>
                <div>
                    <p class="text-sm font-semibold text-gray-800">Other Emergency</p>
                    <p class="text-xs text-gray-500">Describe the situation</p>
                </div>
            </button>
        </div>

        <button onclick="closeSOS()" class="w-full py-3 text-sm font-semibold text-gray-600 hover:bg-gray-100 rounded-xl transition">
            Cancel
        </button>
    </div>
</div>

<!-- ========== TOAST ========== -->
<div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded-xl text-sm font-medium shadow-lg text-white opacity-0 pointer-events-none transition-all duration-300 z-[110]"></div>

<script type="module" src="js/app.js"></script>
<script type="module" src="js/trip.js"></script>
<script type="module" src="js/counter.js"></script>
<script type="module" src="js/sos.js"></script>
<script type="module" src="js/sync.js"></script>
<script type="module" src="js/live-map.js"></script>
</body>
</html>
