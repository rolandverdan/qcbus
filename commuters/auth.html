<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#115272">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Sign In · QCommute</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" href="icons/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/auth.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'qc-blue': '#0D3B54',          // darker navy — gradient start
                        'qc-blue-accent': '#115272',   // QC E-Services accent — gradient end
                        'qc-red': '#CE1126',           // official QC/PH red
                        'qc-yellow': '#FCD116',        // official QC/PH yellow
                    },
                    fontFamily: {
                        sans: ['system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <script>
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        const isAndroid = /Android/i.test(navigator.userAgent);

        if (isAndroid && !isStandalone) {
            window.location.replace("https://qcommute-88bf5.web.app/");
        }
    </script>
</head>
<body class="bg-gray-50 font-sans antialiased">

<div id="authApp" class="max-w-md mx-auto min-h-screen bg-white relative flex flex-col">

    <!-- ============ TOP BRANDING SECTION ============ -->
    <div class="relative bg-gradient-to-br from-qc-blue via-qc-blue-accent to-qc-blue text-white px-6 pt-10 pb-16 rounded-b-[2rem] shadow-lg overflow-hidden">
        <!-- Decorative circles -->
        <div class="absolute -top-10 -right-10 w-40 h-40 bg-white/10 rounded-full"></div>
        <div class="absolute -bottom-16 -left-10 w-56 h-56 bg-white/5 rounded-full"></div>

        <div class="relative">
            <div class="flex items-center gap-2.5 mb-6">
                <div class="w-11 h-11 bg-white rounded-xl flex items-center justify-center p-1 shadow-md">
                    <img src="../images/qclogo2.png" alt="Quezon City" class="w-full h-full object-contain">
                </div>
                <div class="leading-tight">
                    <p class="font-bold text-lg tracking-tight">QCommute</p>
                    <p class="text-[10px] text-white/75 uppercase tracking-widest">Quezon City</p>
                </div>
            </div>

            <h1 id="authHeadline" class="text-2xl font-bold mb-1">Welcome back!</h1>
            <p id="authSubheadline" class="text-sm text-white/80">Sign in to continue tracking the bus.</p>
        </div>
    </div>

    <!-- ============ FORM CARD ============ -->
    <div class="flex-1 -mt-8 px-5 pb-8">
        <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-6">

            <!-- ========== TABS: LOGIN / SIGNUP ========== -->
            <div class="relative bg-gray-100 rounded-xl p-1 flex mb-6">
                <div id="tabIndicator" class="absolute top-1 bottom-1 left-1 w-[calc(50%-4px)] bg-white rounded-lg shadow-sm transition-transform duration-300 ease-out"></div>
                <button id="tabLogin" onclick="switchTab('login')" class="relative z-10 flex-1 py-2 text-sm font-semibold text-qc-blue-accent transition">Sign In</button>
                <button id="tabSignup" onclick="switchTab('signup')" class="relative z-10 flex-1 py-2 text-sm font-semibold text-gray-500 transition">Sign Up</button>
            </div>

            <!-- ========== LOGIN FORM ========== -->
            <form id="loginForm" class="space-y-4" autocomplete="on">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1.5">Email address</label>
                    <div class="relative">
                        <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                        </svg>
                        <input type="email" name="email" required placeholder="you@example.com"
                            class="w-full pl-9 pr-3 py-2.5 text-sm border border-gray-200 rounded-xl focus:border-qc-blue-accent focus:ring-2 focus:ring-blue-100 outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1.5">Password</label>
                    <div class="relative">
                        <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                        <input type="password" name="password" required placeholder="••••••••" id="loginPassword"
                            class="w-full pl-9 pr-10 py-2.5 text-sm border border-gray-200 rounded-xl focus:border-qc-blue-accent focus:ring-2 focus:ring-blue-100 outline-none transition">
                        <button type="button" data-toggle-password="loginPassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-qc-blue-accent toggle-pw">
                            <svg class="w-4 h-4 eye-open" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                            <svg class="w-4 h-4 eye-closed hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <label class="flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" class="w-4 h-4 rounded border-gray-300 text-qc-blue-accent focus:ring-qc-blue-accent">
                        <span class="text-xs text-gray-600">Remember me</span>
                    </label>
                    <button type="button" onclick="showForgotPassword()" class="text-xs text-qc-blue-accent font-medium hover:underline">Forgot password?</button>
                </div>

                <button type="submit" class="w-full py-3 bg-qc-blue-accent hover:bg-qc-blue active:scale-[0.98] text-white text-sm font-semibold rounded-xl shadow-md shadow-blue-200 transition">
                    Sign In
                </button>
            </form>

            <!-- ========== SIGNUP FORM ========== -->
            <form id="signupForm" class="space-y-4 hidden" autocomplete="on">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1.5">Full name</label>
                    <div class="relative">
                        <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                        <input type="text" name="name" required placeholder="Juan Dela Cruz"
                            class="w-full pl-9 pr-3 py-2.5 text-sm border border-gray-200 rounded-xl focus:border-qc-blue-accent focus:ring-2 focus:ring-blue-100 outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1.5">Email address</label>
                    <div class="relative">
                        <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                        </svg>
                        <input type="email" name="email" required placeholder="you@example.com"
                            class="w-full pl-9 pr-3 py-2.5 text-sm border border-gray-200 rounded-xl focus:border-qc-blue-accent focus:ring-2 focus:ring-blue-100 outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1.5">Mobile number</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs font-medium text-gray-500">+63</span>
                        <input type="tel" name="phone" required placeholder="912 345 6789" pattern="[0-9 ]{10,}"
                            class="w-full pl-12 pr-3 py-2.5 text-sm border border-gray-200 rounded-xl focus:border-qc-blue-accent focus:ring-2 focus:ring-blue-100 outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1.5">Password</label>
                    <div class="relative">
                        <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                        <input type="password" name="password" required placeholder="Min 8 characters" minlength="8" id="signupPassword"
                            class="w-full pl-9 pr-10 py-2.5 text-sm border border-gray-200 rounded-xl focus:border-qc-blue-accent focus:ring-2 focus:ring-blue-100 outline-none transition">
                        <button type="button" data-toggle-password="signupPassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-qc-blue-accent toggle-pw">
                            <svg class="w-4 h-4 eye-open" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                            <svg class="w-4 h-4 eye-closed hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                            </svg>
                        </button>
                    </div>
                    <!-- Password strength -->
                    <div class="mt-2 flex gap-1" id="pwStrength">
                        <div class="h-1 flex-1 bg-gray-200 rounded-full transition"></div>
                        <div class="h-1 flex-1 bg-gray-200 rounded-full transition"></div>
                        <div class="h-1 flex-1 bg-gray-200 rounded-full transition"></div>
                        <div class="h-1 flex-1 bg-gray-200 rounded-full transition"></div>
                    </div>
                    <p id="pwStrengthLabel" class="text-[11px] text-gray-400 mt-1">Password strength</p>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1.5">Confirm password</label>
                    <div class="relative">
                        <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622C17.176 19.29 21 14.591 21 9c0-1.042-.133-2.052-.382-3.016z"/>
                        </svg>
                        <input type="password" name="confirmPassword" required placeholder="Re-enter password" id="signupConfirm"
                            class="w-full pl-9 pr-10 py-2.5 text-sm border border-gray-200 rounded-xl focus:border-qc-blue-accent focus:ring-2 focus:ring-blue-100 outline-none transition">
                        <button type="button" data-toggle-password="signupConfirm" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-qc-blue-accent toggle-pw">
                            <svg class="w-4 h-4 eye-open" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                            <svg class="w-4 h-4 eye-closed hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                            </svg>
                        </button>
                    </div>
                    <p id="pwMismatch" class="text-[11px] text-red-500 mt-1 hidden">Passwords do not match</p>
                </div>

                <label class="flex items-start gap-2 cursor-pointer select-none">
                    <input type="checkbox" required class="mt-0.5 w-4 h-4 rounded border-gray-300 text-qc-blue-accent focus:ring-qc-blue-accent">
                    <span class="text-xs text-gray-600 leading-relaxed">
                        I agree to the <a href="#" class="text-qc-blue-accent font-medium hover:underline">Terms of Service</a> and <a href="#" class="text-qc-blue-accent font-medium hover:underline">Privacy Policy</a>
                    </span>
                </label>

                <button type="submit" class="w-full py-3 bg-qc-blue-accent hover:bg-qc-blue active:scale-[0.98] text-white text-sm font-semibold rounded-xl shadow-md shadow-blue-200 transition">
                    Create Account
                </button>
            </form>

            <!-- ========== DIVIDER ========== -->
            <div class="flex items-center gap-3 my-5">
                <div class="flex-1 h-px bg-gray-200"></div>
                <span class="text-[11px] text-gray-400 font-medium">OR</span>
                <div class="flex-1 h-px bg-gray-200"></div>
            </div>

            <!-- ========== SOCIAL BUTTONS ========== -->
            <div class="grid grid-cols-1 gap-3">
                <button type="button" onclick="socialLogin('Google')" class="flex items-center justify-center gap-2 py-2.5 border border-gray-200 rounded-xl hover:bg-gray-50 transition text-sm font-medium text-gray-700">
                    <svg class="w-4 h-4" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    <span>Google</span>
                </button>
            </div>
        </div>

        <!-- ========== FOOTER TEXT ========== -->
        <p id="switchText" class="text-center text-xs text-gray-500 mt-6">
            Don't have an account?
            <button onclick="switchTab('signup')" class="text-qc-blue-accent font-semibold hover:underline">Sign up</button>
        </p>
    </div>
</div>

<!-- ========== TOAST ========== -->
<div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded-xl text-sm font-medium shadow-lg text-white opacity-0 pointer-events-none transition-all duration-300 z-50"></div>

<script type="module" src="js/auth.js"></script>
</body>
</html>
